<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Collector Game</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    gap: 20px;
}

.card {
    text-align: center;
    background: #1e293b;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0, 0, 0, .4);
    width: 320px;
}

h1 {
    margin-top: 0;
    color: #38bdf8;
}

p {
    color: #cbd5e1;
    margin: 10px 0;
}

.download {
    display: inline-block;
    margin-top: 20px;
    padding: 15px 30px;
    background: #22c55e;
    color: white;
    text-decoration: none;
    border-radius: 12px;
    font-size: 20px;
    transition: .3s;
    cursor: pointer;
}

.download:hover {
    background: #16a34a;
}
</style>
</head>

<body>

<div class="card">
    <h1>🎮 Easy Collector Game</h1>
    <p>Collect Batteries 🔋 and Avoid Gears ⚙️</p>
    <p>Download the latest version for Android.</p>

    <a class="download" 
       id="downloadBtn" 
       href="https://drive.google.com/file/d/1h9f_-0xdyK4l-sOLq5vACBkjWEyoU89M/view?usp=drivesdk" 
       target="_blank" 
       rel="noopener noreferrer">
       ⬇ Download APK
    </a>
</div>

<script>
document.getElementById('downloadBtn').addEventListener('click', function(e) {
    var url = this.href;
    if (/Android/i.test(navigator.userAgent)) {
        window.open(url, '_system');
    }
});
</script>

</body>
</html>
